<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#F6F2EA" />
    <meta name="description" content="媒合智联 MediaMatch - 企业需求、人脉与资源对接平台" />
    <meta name="keywords" content="企业资源,需求对接,企业服务" />
    <meta name="author" content="媒合智联 MediaMatch" />
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
    <title>媒合智联 MediaMatch</title>
    <style>
      :root {
        --h5-shell-width: 100%;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC',
          'Hiragino Sans GB', 'Microsoft YaHei', 'Helvetica Neue', Helvetica,
          Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        background-color: #e8edf5;
        overflow: hidden;
        display: flex;
        align-items: flex-start;
        justify-content: center;
      }
      #app {
        position: relative;
        /* 移动端全宽；桌面端在下方媒体查询中切到舒适的小程序工作区。 */
        width: var(--h5-shell-width);
        max-width: 100%;
        min-height: 100vh;
        height: 100vh;
        overflow-x: hidden;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        background: #f5f7fb;
        box-shadow: 0 0 0 1px rgba(48, 59, 87, .06), 0 18px 50px rgba(48, 59, 87, .12);
      }
      @media (min-width: 561px) {
        :root {
          --h5-shell-width: min(960px, calc(100vw - 48px));
        }
        #app {
          max-width: calc(100vw - 48px);
        }
      }
      /* Vue 接管前的品牌化启动兜底，主动画由首页 OpeningRitual 接管。 */
      .loading-container {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background-color: #F6F2EA;
        z-index: 9999;
      }
      .loading-seal {
        width: 76px;
        height: 76px;
        object-fit: contain;
        animation: spin 1.8s linear infinite;
      }
      .loading-text {
        margin-top: 18px;
        color: #5A2530;
        font-size: 14px;
        letter-spacing: .16em;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <noscript>
      <strong>媒合智联 MediaMatch 需要启用 JavaScript 才能正常运行。请启用 JavaScript 后刷新页面。</strong>
    </noscript>
    <div id="app">
      <div class="loading-container">
        <img class="loading-seal" src="/static/images/opening-seal.png" alt="" />
        <div class="loading-text">正在进入你的合作网络</div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
