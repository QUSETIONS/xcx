<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#F6F2EA" />
    <meta name="description" content="媒合智联 MediaMatch - 企业需求、人脉与资源对接平台" />
    <meta name="keywords" content="企业资源,需求对接,企业服务" />
    <meta name="author" content="媒合智联 MediaMatch" />
    <link rel="icon" href="<%= BASE_URL %>static/favicon.svg" type="image/svg+xml" />
    <title>媒合智联 MediaMatch</title>
    <!--preload-links-->
    <!--app-context-->
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC',
          'Hiragino Sans GB', 'Microsoft YaHei', 'Helvetica Neue', Helvetica,
          Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        background-color: #f5f5f5;
      }
      #app {
        width: 100%;
        height: 100%;
      }
      /* Vue 接管前的品牌化启动兜底，主动画由首页 OpeningRitual 接管。 */
      .loading-container {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background-color: #F6F2EA;
        z-index: 9999;
      }
      .loading-seal {
        width: 76px;
        height: 76px;
        object-fit: contain;
        animation: spin 1.8s linear infinite;
      }
      .loading-text {
        margin-top: 18px;
        color: #5A2530;
        font-size: 14px;
        letter-spacing: .16em;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <noscript>
      <strong>媒合智联 MediaMatch 需要启用 JavaScript 才能正常运行。请启用 JavaScript 后刷新页面。</strong>
    </noscript>
    <div id="app">
      <div class="loading-container">
        <img class="loading-seal" src="<%= BASE_URL %>static/images/opening-seal.png" alt="" />
        <div class="loading-text">正在进入你的合作网络</div>
      </div>
    </div>
    <!-- built files will be auto injected -->
  </body>
</html>
